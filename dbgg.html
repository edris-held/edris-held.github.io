<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Du bist gut genug</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
  }
  iframe {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
  }
  .unmute-btn {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 9999;
    font-size: 80px;
    background: rgba(0,0,0,0.4);
    border: none;
    border-radius: 50%;
    width: 160px;
    height: 160px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
  <iframe id="player"
    src="https://www.youtube.com/embed/6oTWBNOz6VQ?autoplay=1&mute=1&loop=1&playlist=6oTWBNOz6VQ&controls=0&enablejsapi=1"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>
  <button class="unmute-btn" id="unmuteBtn" onclick="unmute()">🔇</button>

<script>
  const player = document.getElementById("player");
  const btn = document.getElementById("unmuteBtn");

  function unmute() {
    player.src = player.src.replace("mute=1", "mute=0");
    btn.style.display = "none";
  }
</script>
</body>
</html>
