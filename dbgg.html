<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Du bist gut genug</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    height: 100%;
  }
  iframe {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
  }
  button {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 10;
    padding: 10px 16px;
    font-size: 14px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: 1px solid #fff;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <iframe id="player"
    src="https://www.youtube.com/embed/6oTWBNOz6VQ?autoplay=1&mute=1&loop=1&playlist=6oTWBNOz6VQ&controls=0"
    allow="autoplay; fullscreen"
    allowfullscreen>
  </iframe>
  <button onclick="unmute()">🔊 Unmute</button>

<script>
  const player = document.getElementById("player");
  function unmute() {
    player.src = player.src.replace("mute=1", "mute=0");
  }
</script>
</body>
</html>
