<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Drage heute Einsatz?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: Arial Black, sans-serif;
    position: relative;
  }

  .bubbles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .bubble {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    animation: drift ease-in-out infinite alternate;
    opacity: 0.55;
  }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(var(--dx), var(--dy)) scale(var(--ds)); }
  }

  .crosses-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .cross {
    position: absolute;
    top: -80px;
    animation: fall linear infinite;
    user-select: none;
  }

  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    8%   { opacity: 1; }
    92%  { opacity: 1; }
    100% { transform: translateY(110vh) rotate(20deg); opacity: 0; }
  }

  .nein {
    position: relative;
    z-index: 2;
    color: #ffffff;
    font-size: min(22vw, 180px);
    font-weight: 900;
    letter-spacing: -4px;
    text-shadow: 0 2px 40px rgba(180,0,0,0.6);
    user-select: none;
  }
</style>
</head>
<body>

<div class="bubbles" id="bubbles"></div>
<div class="crosses-container" id="crosses"></div>
<div class="nein">NEIN</div>

<script>
  const bubblesEl = document.getElementById('bubbles');
  const bubbleConfigs = [
    { w: 500, h: 500, top: -10, left: -10,  color: '#cc0000', dur: 9,  dx: '40px',  dy: '30px',  ds: 1.1 },
    { w: 400, h: 400, top: 50,  left: 60,   color: '#990000', dur: 12, dx: '-30px', dy: '50px',  ds: 0.9 },
    { w: 600, h: 600, top: 30,  left: -20,  color: '#ff1a1a', dur: 7,  dx: '20px',  dy: '-20px', ds: 1.05},
    { w: 350, h: 350, top: -5,  left: 50,   color: '#800000', dur: 10, dx: '-40px', dy: '40px',  ds: 1.15},
    { w: 450, h: 450, top: 20,  left: 20,   color: '#b30000', dur: 14, dx: '30px',  dy: '-30px', ds: 0.95},
  ];

  bubbleConfigs.forEach(cfg => {
    const el = document.createElement('div');
    el.className = 'bubble';
    el.style.cssText = `
      width: ${cfg.w}px; height: ${cfg.h}px;
      top: ${cfg.top}%; left: ${cfg.left}%;
      background: ${cfg.color};
      animation-duration: ${cfg.dur}s;
      --dx: ${cfg.dx}; --dy: ${cfg.dy}; --ds: ${cfg.ds};
      animation-delay: ${-Math.random() * cfg.dur}s;
    `;
    bubblesEl.appendChild(el);
  });

  const crossesEl = document.getElementById('crosses');
  for (let i = 0; i < 28; i++) {
    const el = document.createElement('div');
    el.className = 'cross';
    el.textContent = '❌';
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (1.2 + Math.random() * 2.5) + 'rem';
    const dur = 5 + Math.random() * 9;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = (-Math.random() * dur) + 's';
    el.style.opacity = (0.4 + Math.random() * 0.6).toString();
    crossesEl.appendChild(el);
  }
</script>
</body>
</html>
